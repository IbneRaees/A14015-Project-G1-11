# E1: single-pass YOLOv8x-Seg baseline, fine-tuned on FloodNet train.
data_root: data/FloodNet-Supervised_v1.0   # official release, see data/floodnet.py
yolo_dir: datasets/floodnet_yolo           # generated by data/prepare_yolo.py
base_model: yolov8x-seg.pt                 # COCO weights; fine-tuned before evaluation
imgsz: 1024
epochs: 100
batch: 4
seeds: [42, 123, 456]
project: runs/e1
conf: 0.25          # fixed before looking at test; tune on val if you change it
iou: 0.7
device: "0"         # "cpu" for smoke tests
warmup_images: 3
