# E2: monolithic VLM, zero-shot, scored on the shared grid-cell protocol (src/utils/cells.py).
# Surrogate for SkyEyeGPT, whose checkpoint is not public (the official repo says "coming soon").
data_root: data/FloodNet-Supervised_v1.0
vlm_model: Qwen/Qwen2-VL-7B-Instruct
device: cuda
dtype: bfloat16
load_in_4bit: false
crop_max_side: 448        # each cell crop is shrunk to at most this many pixels on its long side
max_new_tokens: 48
log_dir: logs/e2
